<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stramatel Hockey Renderer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="clockRow">
            <div class="clock" id="clock">--:--</div>
            <span class="dot" id="runDot" title="Clock running"></span>
        </div>
        <div class="score"><span id="home">--</span> : <span id="away">--</span></div>

        <div class="meta">
            Period <span id="period">-</span>
        </div>

        <div class="small row">
            <div class="team">
                <div class="timeouts hidden" id="homeTimeouts" aria-label="Home timeouts"></div>
                <div class="penalties hidden" id="homePenalties"></div>
            </div>

            <div class="team away">
                <div class="timeouts hidden" id="awayTimeouts" aria-label="Away timeouts"></div>
                <div class="penalties hidden" id="awayPenalties"></div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
